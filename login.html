<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CookieGPT · Sign in</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#241810;color:#f9e4cb;font-family:system-ui}main{width:min(90vw,380px);background:#35251b;border:1px solid #6d4b32;border-radius:20px;padding:30px;box-sizing:border-box;text-align:center}h1{margin:10px 0}p{color:#cdb29b}input,button{width:100%;box-sizing:border-box;padding:14px;border-radius:10px;font:inherit;margin-top:12px}input{background:#21160f;border:1px solid #8d674b;color:white}button{background:#e6ae74;color:#25160d;border:0;font-weight:bold;cursor:pointer}#error{color:#ffb4a8;min-height:20px;font-size:13px}</style></head><body><main><div style="font-size:52px">🍪</div><h1>CookieGPT</h1><p>Private college study assistant</p><form id="form"><input id="password" type="password" autocomplete="current-password" placeholder="Enter your password" required><button>Sign in</button></form><p id="error" role="alert"></p></main><script>document.querySelector('#form').onsubmit=async e=>{e.preventDefault();const b=document.querySelector('button');b.disabled=true;try{const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:document.querySelector('#password').value})});const d=await r.json();if(!r.ok)throw Error(d.error||'Sign in failed');location.href='/'}catch(e){document.querySelector('#error').textContent=e.message}finally{b.disabled=false}}</script></body></html>
