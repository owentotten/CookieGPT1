<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#241810"><title>CookieGPT — Your College AI Assistant</title><link rel="stylesheet" href="/styles.css"></head><body><div class="app"><aside class="sidebar"><div class="brand"><span class="cookie">🍪</span><span>CookieGPT</span></div><button id="newChat" class="new">＋ New chat</button><div class="small-label">CONVERSATIONS</div><div id="history" class="history"></div><div class="bottom">🎓 Built for college coursework</div></aside><main><header><button id="menu" aria-label="Toggle menu">☰</button><div><strong>CookieGPT</strong><span class="subtitle">Academic AI Assistant</span></div><span class="pill">Study mode</span></header><div id="thread" class="thread"><section id="welcome" class="welcome"><div class="hero">🍪</div><h1>Hi, I'm CookieGPT.</h1><p>Your AI assistant for college coursework, studying, writing, and problem-solving.</p><div class="suggestions"><button data-prompt="Explain a difficult college concept step by step">📚 Explain a concept</button><button data-prompt="Help me make a study guide for my next exam. Ask me what course and topics it covers.">📝 Create a study guide</button><button data-prompt="Quiz me on a college subject. Ask me what subject and difficulty I want.">🧠 Practice quiz</button><button data-prompt="Help me plan and improve a college essay. Ask me for the prompt.">✍️ Writing help</button></div></section></div><div class="input-wrap"><form id="chatForm"><textarea id="prompt" rows="1" placeholder="Ask about an assignment, topic, or exam..." aria-label="Your message"></textarea><button id="send" type="submit" aria-label="Send">↑</button></form><p class="note">CookieGPT can make mistakes. Verify important information and follow your course's AI policy.</p></div></main></div><script src="/app.js"></script><script>document.addEventListener("DOMContentLoaded",()=>{const b=document.createElement("button");b.textContent="Log out";b.style.cssText="position:fixed;top:12px;right:12px;z-index:1000;padding:8px 12px;border-radius:9px;background:#6d4830;color:white;border:1px solid #b18b6b;cursor:pointer";b.onclick=async()=>{await fetch("/api/logout",{method:"POST"});location.href="/login.html"};document.body.appendChild(b)})</script></body></html>
